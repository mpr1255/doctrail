[project]
name = "doctrail"
version = "0.4.1"
description = "SQLite database enrichment tool using LLMs"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.12"
authors = [
    { name = "Doctrail contributors" },
]
maintainers = [
    { name = "Doctrail contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.0",
    "typer",
    "loguru",
    "rich",
    "pyzotero",
    "sqlite-utils",
    "sqlite-fts4",
    "tiktoken",
    "aiohttp",
    "httpx>=0.27",
    "PyYAML",
    "openai>=1.76,<2",
    "anthropic>=0.40",
    "jinja2",
    "google-genai>=1.0.0",
    "pypinyin>=0.54.0",
    "pyalex>=0.18",
    "questionary>=2.0",
    "tqdm>=4.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "claude-agent-sdk>=0.1.45",
    "prompt-toolkit<3.0.52",
    "krippendorff>=0.7",
]

[project.urls]
Homepage = "https://doctrail.org"
Documentation = "https://doctrail.org/llms.txt"
Source = "https://github.com/mpr1255/doctrail"
Issues = "https://github.com/mpr1255/doctrail/issues"
Changelog = "https://github.com/mpr1255/doctrail/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "python-docx>=1.0",
    "python-pptx>=1.0.2",
    "respx",
    "uvicorn[standard]>=0.32.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
ocr = [
    "ocrmypdf>=16.0",
]
icr = [
]

[project.scripts]
doctrail = "doctrail.cli:cli"

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/ingestor/Cargo.toml"
python-source = "src"
module-name = "doctrail._ingest_native"
features = ["extension-module"]
strip = true
include = [
    { path = "docs/llms.txt", format = "sdist" },
    { path = "skills/doctrail/SKILL.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "THIRD_PARTY_NOTICES.txt", format = "sdist" },
]
exclude = [
    "**/__pycache__/**",
    "**/.DS_Store",
    "src/doctrail/_ingest_native*.so",
    "src/doctrail/_ingest_native*.pyd",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.14.0",
    "python-docx>=1.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [
    ".unison",
    ".venv",
    ".venv*",
    ".history",
    ".deleted",
    "agents",
    "data",
    "notes",
    "out",
    "scratch",
    "tmp",
]
