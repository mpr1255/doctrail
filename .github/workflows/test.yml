name: tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  UV_PYTHON: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install system build and PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libclang-dev clang make

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ingestor

      - name: Run Rust tests
        run: cargo test --manifest-path native/ingestor/Cargo.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies and build extension
        run: uv sync --locked --extra test

      - name: Run Python tests
        run: make test

      - name: Check generated docs freshness
        run: make docs-fresh

      - name: Build and smoke-test wheel
        run: |
          uv run --with 'maturin>=1.7,<2' maturin build --release --out dist
          whl="$(ls dist/*.whl | head -1)"
          uvx --from "$whl" doctrail --version
          uvx --from "$whl" doctrail docs > /tmp/wheel-llms.txt
          cmp docs/llms.txt /tmp/wheel-llms.txt
          uvx --from "$whl" doctrail skill > /tmp/wheel-skill.txt
          cmp skills/doctrail/SKILL.md /tmp/wheel-skill.txt
          uvx --from "$whl" python -c "from doctrail.extract import extract_file; doc = extract_file('tests/assets/files/federalist_fixture.pdf'); assert doc['status'] == 'extracted' and len(doc['pages']) == 1"
