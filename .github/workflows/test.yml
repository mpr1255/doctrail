name: tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  UV_PYTHON: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run tests
        run: make test
