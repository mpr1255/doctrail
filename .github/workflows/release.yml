name: release

on:
  push:
    tags:
      - "v*"

env:
  UV_PYTHON: "3.12"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system build and PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils w3m libclang-dev clang make

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ingestor

      - name: Run Rust tests
        run: cargo test --manifest-path native/ingestor/Cargo.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check release tag matches package version
        run: |
          package_version="$(uv run --no-sync python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $package_version" >&2
            exit 1
          fi

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run release checks
        run: make release-check

      - name: Require Pages deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1500))
          while true; do
            run_fields="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow docs.yml \
              --commit "$GITHUB_SHA" \
              --branch master \
              --limit 1 \
              --json databaseId,status,conclusion,url \
              --jq '.[0] | [.databaseId,.status,.conclusion,.url] | @tsv' || true)"

            if [ -n "$run_fields" ]; then
              docs_run_id="$(printf '%s\n' "$run_fields" | cut -f1)"
              docs_status="$(printf '%s\n' "$run_fields" | cut -f2)"
              docs_conclusion="$(printf '%s\n' "$run_fields" | cut -f3)"
              docs_url="$(printf '%s\n' "$run_fields" | cut -f4)"
              echo "Docs workflow ${docs_run_id}: ${docs_status}/${docs_conclusion} ${docs_url}"
              if [ "$docs_status" = "completed" ]; then
                if [ "$docs_conclusion" = "success" ]; then
                  exit 0
                fi
                echo "Docs workflow failed for ${GITHUB_SHA}: ${docs_url}" >&2
                exit 1
              fi
            else
              echo "Waiting for docs workflow for ${GITHUB_SHA} on master"
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for docs workflow for ${GITHUB_SHA} on master" >&2
              exit 1
            fi
            sleep 15
          done

  linux-wheels:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "false"
          manylinux: 2_28
          before-script-linux: "dnf install -y clang-devel make || yum install -y clang-devel make"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos-wheels:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [verify, linux-wheels, macos-wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Refuse paper artifacts
        run: |
          for archive in dist/*.tar.gz; do
            if tar -tzf "$archive" | grep -E '^doctrail-[^/]+/(_paper|paper)(/|$)'; then
              echo "Paper files are present in $archive" >&2
              exit 1
            fi
          done
          for wheel in dist/*.whl; do
            if unzip -Z1 "$wheel" | grep -E '^(_paper|paper)(/|$)'; then
              echo "Paper files are present in $wheel" >&2
              exit 1
            fi
          done

      - name: Check package metadata
        run: uvx --from twine twine check dist/*

      - name: Install Poppler for wheel smoke test
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Smoke test Linux x86_64 wheel
        run: |
          shopt -s nullglob
          linux_wheels=(dist/*manylinux*x86_64*.whl)
          if [ "${#linux_wheels[@]}" -ne 1 ]; then
            echo "Expected exactly 1 Linux x86_64 wheel, found ${#linux_wheels[@]}: ${linux_wheels[*]}" >&2
            exit 1
          fi
          whl="$(realpath "${linux_wheels[0]}")"
          fixture="$(realpath tests/assets/files/federalist_fixture.pdf)"
          llms_ref="$(realpath docs/llms.txt)"
          skill_ref="$(realpath skills/doctrail/SKILL.md)"
          repo_root="$(realpath .)"
          tmpdir="$(mktemp -d)"
          (
            cd "$tmpdir"
            uvx --from "$whl" doctrail --version
            uvx --from "$whl" doctrail docs > "$tmpdir/wheel-llms.txt"
            cmp "$llms_ref" "$tmpdir/wheel-llms.txt"
            uvx --from "$whl" doctrail skill > "$tmpdir/wheel-skill.txt"
            cmp "$skill_ref" "$tmpdir/wheel-skill.txt"
            uvx --from "$whl" python -c "
          import os, doctrail._ingest_native as n
          from doctrail.extract import extract_file
          assert not os.path.realpath(n.__file__).startswith('$repo_root'), n.__file__
          doc = extract_file('$fixture')
          assert doc['status'] == 'extracted' and len(doc['pages']) == 1, doc
          "
            uvx --from "$whl" doctrail init test
            uvx --from "$whl" doctrail run test
          )
          rm -rf "$tmpdir"

      - name: Upload combined distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doctrail-dist
          path: dist/*

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
