name: release

on:
  push:
    tags:
      - "v*"

env:
  UV_PYTHON: "3.12"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check release tag matches package version
        run: |
          package_version="$(uv run --no-sync python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $package_version" >&2
            exit 1
          fi

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run release checks
        run: make release-check

      - name: Require Pages deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1500))
          while true; do
            run_fields="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow docs.yml \
              --commit "$GITHUB_SHA" \
              --branch master \
              --limit 1 \
              --json databaseId,status,conclusion,url \
              --jq '.[0] | [.databaseId,.status,.conclusion,.url] | @tsv' || true)"

            if [ -n "$run_fields" ]; then
              docs_run_id="$(printf '%s\n' "$run_fields" | cut -f1)"
              docs_status="$(printf '%s\n' "$run_fields" | cut -f2)"
              docs_conclusion="$(printf '%s\n' "$run_fields" | cut -f3)"
              docs_url="$(printf '%s\n' "$run_fields" | cut -f4)"
              echo "Docs workflow ${docs_run_id}: ${docs_status}/${docs_conclusion} ${docs_url}"
              if [ "$docs_status" = "completed" ]; then
                if [ "$docs_conclusion" = "success" ]; then
                  exit 0
                fi
                echo "Docs workflow failed for ${GITHUB_SHA}: ${docs_url}" >&2
                exit 1
              fi
            else
              echo "Waiting for docs workflow for ${GITHUB_SHA} on master"
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for docs workflow for ${GITHUB_SHA} on master" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Prepare distribution directory
        run: |
          uv run --no-sync python - <<'PY'
          import shutil
          from pathlib import Path
          dist = Path("dist")
          if dist.exists():
              shutil.rmtree(dist)
          PY

      - name: Build package artifacts
        run: uv build --no-sources

      - name: Refuse paper artifacts
        run: |
          for archive in dist/*.tar.gz; do
            if tar -tzf "$archive" | grep -E '^doctrail-[^/]+/(_paper|paper)(/|$)'; then
              echo "Paper files are present in $archive" >&2
              exit 1
            fi
          done
          for wheel in dist/*.whl; do
            if unzip -Z1 "$wheel" | grep -E '^(_paper|paper)(/|$)'; then
              echo "Paper files are present in $wheel" >&2
              exit 1
            fi
          done

      - name: Check package metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke test wheel
        run: |
          for wheel in dist/*.whl; do
            uvx --from "$wheel" doctrail --version
          done

      - name: Smoke test source distribution
        run: |
          for archive in dist/*.tar.gz; do
            uvx --from "$archive" doctrail --version
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doctrail-dist
          path: dist/*

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
