[package]
edition = "2021"
name = "readabilityrs"
version = "0.1.3"
authors = ["readabilityrs contributors"]
description = "A Rust port of Mozilla's Readability library for extracting article content from web pages"
readme = "README.md"
keywords = ["readability", "parser", "article", "extraction", "html"]
categories = ["parser-implementations", "web-programming"]
license = "Apache-2.0"
repository = "https://github.com/theiskaa/readabilityrs"

[lib]
name = "readabilityrs"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.4"

[dependencies.kuchikikiki]
version = "0.9"

[dependencies.once_cell]
version = "1.19"

[dependencies.regex]
version = "1.10"

[dependencies.scraper]
version = "0.25"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.thiserror]
version = "1.0"

[dependencies.url]
version = "2.5"

[dependencies.v_htmlescape]
version = "=0.15.8"
