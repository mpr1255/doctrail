site_name: Doctrail
site_description: Auditable, structured document annotation with LLMs
site_url: https://doctrail.org/
repo_url: https://github.com/mpr1255/doctrail
repo_name: mpr1255/doctrail

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mascot.png
  favicon: assets/mascot.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Doctrail: index.md
  - Quick start: quickstart.md
  - Tutorial: tutorial.md
  - Code books: yaml.md
  - Data model: data-model.md
  - Reference: cli.md

validation:
  nav:
    omitted_files: ignore

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - mkdocs-click
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
